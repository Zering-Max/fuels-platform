version: 2

models:
  - name: stg_fuels_stations_data
    description: ensemble des stations essence recensées en France, les données sont rafraîchies toutes les 15 minutes.
      Lien => https://www.data.gouv.fr/datasets/prix-des-carburants-en-france-flux-instantane-v2-amelioree
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - longitude
              - latitude
    columns:
      - name: id
        description: Identifiant unique de la station
        type: VARCHAR
        data_tests:
          - not_null
          - unique
      - name: latitude
        description: donnée géographique de latitude de la station
        type: FLOAT
        data_tests:
          - not_null
      - name: longitude
        description: donnée géographique de longitude de la station
        type: FLOAT
        data_tests:
          - not_null
      - name: cp
        description: Code postal de la station
        type: VARCHAR
      - name: adresse
        description: Adresse de la station (numéro & rue/avenue/etc..)
        type: VARCHAR
      - name: ville
        description: Nom de la ville où se trouve la station
        type: VARCHAR
      - name: prix_Gazole
        description : Prix du litre de Gazole de la station
        type: FLOAT
      - name: prix_SP95
        description: Prix du litre d'essence Sans Plomb 95 de la station
        type: FLOAT
      - name: prix_E85
        description: Prix du litre d'essence 85% éthanol de la station
        type: FLOAT
      - name: prix_GPLc
        description: Prix du litre de Gaz Pétrole Liquéfié de la station
        type: FLOAT
      - name: prix_E10
        description: Prix du litre d'essence 10% éthanol de la station
        type: FLOAT
      - name: prix_SP98
        description: Prix du litre d'essence Sans Plomb 98 de la station
        type: FLOAT
      - name: carburants_disponibles
        description : types de carburants disponibles à la station (sous la forme d'une chaîne de caractères)
        type: VARCHAR
      - name: departement
        description: Nom du département où se trouve la station
        type: VARCHAR
      - name: code_departement
        description: Code du département où se trouve la station
      - name: region
        description: Nom de la région où se trouve la station
        type: VARCHAR
      - name: code_region
        description : Code région où se trouve la station
        type: VARCHAR